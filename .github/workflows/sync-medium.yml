name: Sync Medium articles

on:
  workflow_dispatch:
  schedule:
    - cron: "18 8 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/sync_medium.py
      - name: Commit refreshed article data
        run: |
          if git diff --quiet -- _data/medium.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/medium.json
          git commit -m "chore: sync Medium articles"
          git push
